<style>

        .spotlight-glow {

        }
        .spotlight-glow::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(244, 189, 97, 0.15) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;

            display: flex;

            align-items: center;

            content: '';
            height: 1px;
            flex-grow: 1;
